version: '3.8'

services:
  # Next.js Frontend
  frontend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - luminall-network

  # NestJS Backend (optional)
  backend:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./apps/api:/app
    ports:
      - "5000:5000"
    command: sh -c "npm install && npm run start:prod"
    environment:
      - NODE_ENV=production
      - PORT=5000
    restart: unless-stopped
    networks:
      - luminall-network

  # PostgreSQL Database (optional)
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: luminall
      POSTGRES_PASSWORD: propertyinsight
      POSTGRES_DB: luminall_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - luminall-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - luminall-network

networks:
  luminall-network:
    driver: bridge

volumes:
  postgres_data: