# infrastructure/kubernetes/api-deployment.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: luminall-api
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: luminall-api
  template:
    metadata:
      labels:
        app: luminall-api
    spec:
      containers:
        - name: api
          image: luminall/api:latest
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: luminall-secrets
                  key: database-url
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: luminall-api-service
  namespace: production
spec:
  selector:
    app: luminall-api
  ports:
    - port: 80
      targetPort: 3001
  type: LoadBalancer